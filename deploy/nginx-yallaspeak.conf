server {
    listen 80;
    listen [::]:80;
    server_name yallaspeak.lekibbitz.fr;

    # certbot writes its challenge here, everything else goes to TLS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 is already enabled for :443 by another vhost, repeating it warns
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yallaspeak.lekibbitz.fr;

    ssl_certificate     /etc/letsencrypt/live/yallaspeak.lekibbitz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yallaspeak.lekibbitz.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app sends every security header itself, HSTS included. Setting any of
    # them here too appends a second copy rather than replacing it.

    access_log /var/log/nginx/yallaspeak.access.log;
    error_log  /var/log/nginx/yallaspeak.error.log;

    # Generated audio: immutable, so nginx serves the repeats itself
    location /api/tts {
        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache yallaspeak_tts;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$request_uri";
        # One upstream generation shared by every waiting client
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Cold generation can take several seconds
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
